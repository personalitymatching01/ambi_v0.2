<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account confirmed · Zaphyr</title>
  <meta name="description" content="Your Zaphyr account is confirmed.">
  <!-- Fonts are self-hosted (assets/fonts/) so no request leaves this origin. -->
  <link rel="preload" href="assets/fonts/dm-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-garamond-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link href="assets/fonts/fonts.css" rel="stylesheet">
  <style>
    /* Brand tokens, copied from zaphyr_mobile/constants/design.ts (Palette, Type,
       Radius, Shadow). Hellblau #A0BEDA, Schokobraun #34211B, white. */
    :root {
      --bg: #FFFFFF;
      --text: #34211B;           /* 15.2:1 on white */
      --text-secondary: #7D716D; /* 4.7:1 on white */
      --accent-soft: #A0BEDA;    /* Hellblau */
      --tint: #E4EDF5;           /* Hellblau at 28% on white */
      --hairline: #E1DEDD;
      --shadow: 0 6px 16px rgba(52, 33, 27, 0.08);
      --radius-xl: 24px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .wrap { width: 100%; max-width: 440px; text-align: center; }
    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 28px;
      letter-spacing: 8px;
      padding-left: 8px; /* balances the trailing letter-spacing */
      color: var(--text);
      margin: 0 0 32px;
    }
    .card {
      background: var(--bg);
      border-radius: var(--radius-xl);
      padding: 40px 32px 36px;
      box-shadow: var(--shadow);
      border: 1px solid var(--hairline);
    }
    .check {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--tint);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .check-inner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 28px; height: 28px; }
    .eyebrow {
      display: inline-block;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      color: var(--text);
      background: var(--tint);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      margin: 0 0 14px;
    }
    h1 {
      font-weight: 700;
      font-size: 32px;
      line-height: 38px;
      letter-spacing: -0.5px;
      margin: 0 0 12px;
      color: var(--text);
    }
    .body {
      font-size: 17px;
      line-height: 25px;
      color: var(--text-secondary);
      margin: 0 auto;
      max-width: 360px;
    }
    .body strong { color: var(--text); font-weight: 600; }
    .slogan {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 20px;
      line-height: 26px;
      color: var(--text);
      margin: 32px 0 6px;
    }
    .footer {
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      color: var(--text-secondary);
      margin: 0;
    }
    /* Phones: no card chrome, the page itself is the white surface. */
    @media (max-width: 520px) {
      body { align-items: flex-start; padding-top: 56px; }
      .card { box-shadow: none; border: none; padding: 0; border-radius: 0; }
      h1 { font-size: 28px; line-height: 34px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="wordmark">ZAPHYR</p>

    <div class="card">
      <div class="check" aria-hidden="true">
        <div class="check-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="#34211B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
      </div>

      <p class="eyebrow">You're all set</p>
      <h1>Account confirmed</h1>
      <p class="body">
        Your email is verified and your account is active. Open the <strong>Zaphyr</strong> app and
        <strong>log in</strong> to pick up where you left off.
      </p>
    </div>

    <p class="slogan">Personality first. Chemistry follows.</p>
    <p class="footer">You can close this tab.</p>
  </main>
</body>
</html>
